// https://github.com/grails-plugins/grails-plugin-template/tree/main/build-logic
def docProject = provider {
    project(":${project.name - 'root'}docs")
}
def pluginProject = provider {
    project(":${project.name - '-root'}")
}

def cleanDocs = tasks.register('cleanDocs', Delete) {
    description = 'Deletes the documentation output'
    group = 'documentation'

    delete(rootProject.layout.projectDirectory.dir('build/docs'))
}

// The Groovydoc task is registered on the plugin project rather than here: it resolves the
// compile and groovy classpaths of the project it documents, and Gradle forbids a task owned
// by one project from resolving another project's configurations.
def gapiDir = rootProject.layout.buildDirectory.dir('docs/gapi').get().asFile
def pluginProjectPath = pluginProject.get().path
pluginProject.get().pluginManager.withPlugin('groovy') {
    def plugin = pluginProject.get()
    def upstream = plugin.tasks.named('groovydoc', Groovydoc)
    plugin.tasks.register('groovyApiDoc', Groovydoc) {
        description = 'Generates Groovy API Documentation for the plugin project under build/docs/gapi'
        group = 'documentation'

        mustRunAfter(cleanDocs)

        access = GroovydocAccess.PROTECTED
        includeAuthor = false
        includeMainForScripts = true
        processScripts = true
        exclude('**/Application.groovy')

        source(upstream.map { it.source })
        destinationDir = gapiDir
        classpath = plugin.files(upstream.map { it.classpath })
        groovyClasspath = plugin.files(upstream.map { it.groovyClasspath })
    }
}

tasks.register('aggregateGroovyApiDoc') {
    description = 'Generates Groovy API Documentation for the plugin project under build/docs/gapi'
    group = 'documentation'

    dependsOn(cleanDocs, "$pluginProjectPath:groovyApiDoc")
}

tasks.register('docs') {
    description = 'Generates the documentation'
    group = 'documentation'

    dependsOn(
            'aggregateGroovyApiDoc',
            docProject.get().tasks.named('asciidoctor')
    )
    finalizedBy(
            'copyAsciiDoctorDocs'
    )
}

tasks.register('copyAsciiDoctorDocs', Copy) {
    group = 'documentation'

    from(docProject.flatMap { it.layout.buildDirectory })
    into(rootProject.layout.buildDirectory)
    include('docs/**')
    includeEmptyDirs = false

}
