---
grails:
    profile: web
    codegen:
        defaultPackage: app1
    spring:
        transactionManagement:
            proxies: false
    plugin:
        greenmail:
            ports:
                # Deliberately not GreenMail's default 3025, so the integration
                # tests prove this override is honoured.
                smtp: 2525
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
spring:
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    mail:
        host: localhost
        port: 2525

---
grails:
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlets: html
                taglib: none
                staticparts: none
